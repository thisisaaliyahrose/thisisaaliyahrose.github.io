<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Study — Aaliyah Rose (Draft V2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* V2 case study: information first (title, overview, details), then the hero images one by one */
  :root {
    --paper: #efede8; --ink: #111111; --muted: #77736c;
    --rule: rgba(17, 17, 17, .14); --signal: #ff3b1f;
    --ease: cubic-bezier(.22, .8, .2, 1); --gutter: clamp(16px, 2.4vw, 32px);
    color-scheme: light;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--paper); color: var(--ink); font: 400 15px/1.5 "Instrument Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 11px; letter-spacing: .02em; text-transform: uppercase; }
  .muted { color: var(--muted); }

  .bar { position: sticky; top: 0; z-index: 20; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 14px var(--gutter); border-bottom: 1px solid var(--rule); background: color-mix(in srgb, var(--paper) 88%, transparent); backdrop-filter: blur(6px); }
  .bar nav { display: flex; gap: 28px; font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  .bar .back { justify-self: end; }
  .bar a:hover { color: var(--signal); }

  /* ---- information first ---- */
  .head { padding: 56px var(--gutter) 0; }
  .head .meta { display: flex; justify-content: space-between; padding-bottom: 14px; border-bottom: 1px solid var(--ink); }
  .head h1 { font-weight: 600; font-size: clamp(44px, 8.4vw, 136px); line-height: .9; letter-spacing: -.025em; text-transform: uppercase; margin: 28px 0 10px; hyphens: none; }
  .info { display: grid; grid-template-columns: minmax(220px, 1fr) 2fr; gap: 24px 48px; padding: 40px var(--gutter) 56px; }
  .details { border-top: 1px solid var(--rule); align-self: start; }
  .details div { display: grid; grid-template-columns: 110px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rule); }
  .details dd { font-size: 13px; }
  .sections { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 32px 40px; }
  .sections article { border-top: 1px solid var(--rule); padding-top: 10px; }
  .sections h2 { margin-bottom: 10px; }
  .sections p { font-size: 15px; line-height: 1.55; max-width: 60ch; text-wrap: pretty; }

  /* ---- hero images, one at a time ---- */
  .gallery { display: grid; gap: 8px; padding: 0 var(--gutter); }
  .gallery figure { position: relative; }
  .gallery img { display: block; width: 100%; height: auto; border-radius: 4px; background: #e2dfd8; }
  /* square logo animations: centred in a 16:9 white frame, edges feathered so shapes drift in rather than being cut off */
  .gallery video { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: contain; background: #fff; border-radius: 4px;
    --fx: linear-gradient(to right, transparent 21.9%, #000 27.5%, #000 72.5%, transparent 78.1%);
    --fy: linear-gradient(to bottom, transparent 0%, #000 10%, #000 90%, transparent 100%);
    -webkit-mask-image: var(--fx), var(--fy); -webkit-mask-composite: source-in; mask-image: var(--fx), var(--fy); mask-composite: intersect; }
  .gallery figure:has(video), .gallery video { background-color: #fff; }
  .gallery figcaption { position: absolute; right: 10px; bottom: 10px; padding: 3px 6px; background: var(--paper); border-radius: 2px; opacity: 0; transition: opacity .3s; }
  .gallery figure:hover figcaption { opacity: 1; }

  /* ---- next project ---- */
  .next { display: block; margin: 72px var(--gutter) 0; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); transition: background .35s var(--ease), color .35s var(--ease); }
  .next .row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 18px 10px; }
  .next strong { font-weight: 600; font-size: clamp(26px, 4.2vw, 60px); line-height: 1; text-transform: uppercase; letter-spacing: -.01em; }
  .next:hover { background: var(--ink); color: var(--paper); }
  footer { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 22px var(--gutter) 28px; }
  footer a:hover { color: var(--signal); }

  .reveal { opacity: 0; transform: translateY(24px); transition: opacity .9s ease, transform 1.1s var(--ease); transition-delay: var(--d, 0s); }
  .reveal.in { opacity: 1; transform: none; }
  @media (max-width: 860px) { .info { grid-template-columns: 1fr; } .sections { grid-template-columns: 1fr; } .bar { grid-template-columns: 1fr auto; } .bar nav { display: none; } }
  /* ink.js paper texture: keep it a whisper on light paper */
  .ink-paper { opacity: .035 !important; }
  .ink-grain { opacity: .05 !important; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header class="bar">
  <a class="mono" href="index.html" data-ground="#efede8">This is Aaliyah Rose</a>
  <nav><a href="index.html#work" data-ground="#efede8">Work</a><a href="index.html#about" data-ground="#efede8">About</a><a href="index.html#contact" data-ground="#efede8">Contact</a></nav>
  <a class="mono back" href="index.html#work" data-ground="#efede8">← Index</a>
</header>

<main>
  <section class="head">
    <div class="meta mono"><span id="count">Case 01 / 08</span><span class="muted" id="kind"></span></div>
    <h1 id="title" class="reveal"></h1>
  </section>
  <section class="info">
    <dl class="details mono reveal" id="details" style="--d:.1s"></dl>
    <div class="sections" id="sections"></div>
  </section>
  <section class="gallery" id="gallery" aria-label="Project images"></section>
  <a class="next" id="next" data-ground="#efede8"><div class="row"><span class="mono">Next project →</span><strong id="nextName"></strong></div></a>
</main>
<footer class="mono">
  <a href="mailto:thisisaaliyahrose@gmail.com">thisisaaliyahrose@gmail.com</a>
  <span class="muted">© 2026 Aaliyah Rose — Draft V2</span>
  <a href="#">Back to top ↑</a>
</footer>

<script src="../shared/ink.js?v=8"></script>
<script src="../shared/projects.js"></script>
<script>
  const slug = new URLSearchParams(location.search).get("p") || PROJECTS[0].slug;
  const i = Math.max(0, PROJECTS.findIndex(p => p.slug === slug));
  const p = PROJECTS[i], n = PROJECTS[(i + 1) % PROJECTS.length];
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  document.title = `${p.name} — Aaliyah Rose (Draft V2)`;
  document.getElementById("count").textContent = `Case ${String(i + 1).padStart(2, "0")} / ${String(PROJECTS.length).padStart(2, "0")}`;
  document.getElementById("kind").textContent = p.kind;
  document.getElementById("title").textContent = p.name;
  document.getElementById("details").innerHTML = p.details.map(([k, v]) => `<div><dt class="muted">${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("");
  document.getElementById("sections").innerHTML = p.sections.map(([h, t], k) => `<article class="reveal" style="--d:${.12 + k * .06}s"><h2 class="mono muted">${esc(h)}</h2><p>${esc(t)}</p></article>`).join("");
  document.getElementById("gallery").innerHTML = p.images.map((src, k) => `<figure class="reveal">${src.endsWith(".mp4") ? `<video src="${src}" autoplay muted loop playsinline aria-label="${esc(p.name)}, animation"></video>` : `<img src="${src}" alt="${esc(p.name)}, image ${k + 1}" loading="${k ? "lazy" : "eager"}">`}<figcaption class="mono">Fig. ${String(k + 1).padStart(2, "0")}</figcaption></figure>`).join("");
  const next = document.getElementById("next"); next.href = `case.html?p=${n.slug}`;
  document.getElementById("nextName").textContent = n.name;

  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }), { threshold: .1 });
  document.querySelectorAll(".reveal").forEach(el => io.observe(el));
  // the information block is the first thing you see, so bring it in straight away
  requestAnimationFrame(() => document.querySelectorAll(".head .reveal, .info .reveal").forEach(el => el.classList.add("in")));
</script>
</body>
</html>
