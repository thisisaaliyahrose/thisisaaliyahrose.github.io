<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aaliyah Rose — Portfolio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4f3ef;
    --fg: #111;
    --muted: #6b6b6b;
    --line: #d9d7d1;
    --tile: #e6e4de;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0c0c; --fg: #f2f2f2; --muted: #8a8a8a; --line: #262626; --tile: #1a1a1a; }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 Inter, system-ui, sans-serif;
  }
  header {
    display: flex; justify-content: space-between; align-items: end; gap: 16px;
    padding: 48px clamp(16px, 4vw, 48px) 24px;
    border-bottom: 1px solid var(--line);
  }
  h1 { font: 400 clamp(40px, 7vw, 88px)/0.9 "Instrument Serif", serif; letter-spacing: -0.01em; }
  header p { color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; font-size: 12px; text-align: right; }
  main {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr));
    gap: clamp(8px, 1.2vw, 16px);
    padding: clamp(16px, 4vw, 48px);
  }
  figure { position: relative; cursor: zoom-in; scroll-margin-top: 24px; }
  figure img {
    display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover;
    background: var(--tile); transition: transform .25s ease, opacity .25s ease;
  }
  figure:hover img { transform: scale(1.015); }
  figcaption {
    position: absolute; left: 8px; bottom: 8px; padding: 2px 6px;
    font-size: 11px; background: rgba(0,0,0,.55); color: #fff; opacity: 0; transition: opacity .2s;
  }
  figure:hover figcaption, figure:focus-visible figcaption { opacity: 1; }
  figure:focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }

  dialog {
    max-width: none; max-height: none; width: 100vw; height: 100vh;
    border: 0; padding: 0; background: rgba(0,0,0,.94); color: #fff;
  }
  dialog::backdrop { background: transparent; }
  dialog .stage { display: grid; place-items: center; width: 100%; height: 100%; padding: 56px 16px; }
  dialog img { max-width: 100%; max-height: 100%; object-fit: contain; }
  dialog button {
    position: absolute; background: none; border: 0; color: #fff; cursor: pointer;
    font: 400 32px/1 "Instrument Serif", serif; padding: 12px 16px; opacity: .7;
  }
  dialog button:hover { opacity: 1; }
  .close { top: 8px; right: 8px; }
  .prev { left: 4px; top: 50%; translate: 0 -50%; }
  .next { right: 4px; top: 50%; translate: 0 -50%; }
  .count { position: absolute; top: 20px; left: 20px; font-size: 12px; letter-spacing: .08em; opacity: .7; }
</style>
</head>
<body>
<header>
  <h1><a href="index.html" style="color:inherit;text-decoration:none">Aaliyah Rose</a></h1>
  <p>Portfolio 2026<br><span id="total"></span> pages</p>
</header>
<main id="grid"></main>

<dialog id="lightbox">
  <span class="count" id="count"></span>
  <button class="close" aria-label="Close">×</button>
  <button class="prev" aria-label="Previous">‹</button>
  <button class="next" aria-label="Next">›</button>
  <div class="stage"><img id="full" alt=""></div>
</dialog>

<script>
  const TOTAL = 222;
  const src = i => `images/page-${String(i).padStart(3, "0")}.jpg`;
  const grid = document.getElementById("grid");
  document.getElementById("total").textContent = TOTAL;

  for (let i = 1; i <= TOTAL; i++) {
    const fig = document.createElement("figure");
    fig.tabIndex = 0;
    fig.id = `page-${i}`;
    fig.innerHTML = `<img src="${src(i)}" alt="Portfolio page ${i}" loading="lazy" decoding="async"><figcaption>${String(i).padStart(2, "0")}</figcaption>`;
    fig.addEventListener("click", () => open(i));
    fig.addEventListener("keydown", e => { if (e.key === "Enter") open(i); });
    grid.appendChild(fig);
  }

  const box = document.getElementById("lightbox");
  const full = document.getElementById("full");
  const count = document.getElementById("count");
  let current = 1;

  function open(i) {
    current = (i - 1 + TOTAL) % TOTAL + 1;
    full.src = src(current);
    full.alt = `Portfolio page ${current}`;
    count.textContent = `${current} / ${TOTAL}`;
    if (!box.open) box.showModal();
  }
  box.querySelector(".close").onclick = () => box.close();
  box.querySelector(".prev").onclick = () => open(current - 1);
  box.querySelector(".next").onclick = () => open(current + 1);
  box.querySelector(".stage").onclick = e => { if (e.target !== full) box.close(); };
  const m = location.hash.match(/^#page-(\d+)$/);
  if (m) document.getElementById(`page-${m[1]}`)?.scrollIntoView();

  box.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") open(current - 1);
    if (e.key === "ArrowRight") open(current + 1);
  });
</script>
</body>
</html>
